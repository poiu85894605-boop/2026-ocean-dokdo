<body class="selection:bg-cyan-500 selection:text-white">
  <div id="root"></div>

  <!-- Firebase Integration Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // Global Firebase setup with fallbacks
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'ocean-middle-dokdo-2026';
    let db = null;
    let auth = null;
    let currentUser = null;

    try {
      if (typeof __firebase_config !== 'undefined') {
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        db = getFirestore(app);
        auth = getAuth(app);

        // Authenticate immediately
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          signInWithCustomToken(auth, __initial_auth_token).catch(() => signInAnonymously(auth));
        } else {
          signInAnonymously(auth).catch(console.error);
        }

        onAuthStateChanged(auth, (user) => {
          currentUser = user;
          window.dispatchEvent(new CustomEvent('firebaseAuthReady', { detail: { user, db, appId } }));
        });
      }
    } catch (e) {
      console.warn("Firebase initialization fallback mode enabled:", e);
    }

    // Expose reference globally for React components
    window.oceanFirebase = {
      getDb: () => db,
      getAuth: () => auth,
      getAppId: () => appId,
      getUser: () => currentUser,
      getCollectionPath: () => `artifacts/${appId}/public/data/ocean_dokdo_poems`
    };
  </script>

  <!-- React Application Logic -->
  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // 1. Keyword dataset based on school guidelines
    const KEYWORDS_DATA = [
      // 초급 코스 (3행시)
      { 
        id: 'dokdori', 
        name: '독도리', 
        level: '초급', 
        lines: 3, 
        chars: ['독', '도', '리'], 
        desc: '경상북도 울릉군 울릉읍 독도리 — 우리나라의 명백한 행정 구역이자 영토 주권의 상징' 
      },
      { 
        id: 'isabu', 
        name: '이사부', 
        level: '초급', 
        lines: 3, 
        chars: ['이', '사', '부'], 
        desc: '서기 512년(신라 지증왕 13년) 우산국을 신라 영토로 최초 편입시킨 신라의 장군' 
      },
      { 
        id: 'anyongbok', 
        name: '안용복', 
        level: '초급', 
        lines: 3, 
        chars: ['안', '용', '복'], 
        desc: '조선 시대 일본에 맞서 독도가 조선 땅임을 확약받은 자랑스러운 민간 외교가' 
      },
      { 
        id: 'ulleungdo', 
        name: '울릉도', 
        level: '초급', 
        lines: 3, 
        chars: ['울', '릉', '도'], 
        desc: '독도에서 가장 가까운 형제 섬이자 역사적·지리적 짝꿍 섬 (거리 87.4km)' 
      },

      // 중급 코스 (4행시)
      { 
        id: 'donghaebada', 
        name: '동해바다', 
        level: '중급', 
        lines: 4, 
        chars: ['동', '해', '바', '다'], 
        desc: '독도가 당당히 서 있는 대한민국의 푸르고 넓은 바다' 
      },
      { 
        id: 'samguksagi', 
        name: '삼국사기', 
        level: '중급', 
        lines: 4, 
        chars: ['삼', '국', '사', '기'], 
        desc: '이사부 장군의 우산국 복속 사실이 최초로 기록된 역사서 (김부식 지음)' 
      },
      { 
        id: 'daehanjeguk', 
        name: '대한제국', 
        level: '중급', 
        lines: 4, 
        chars: ['대', '한', '제', '국'], 
        desc: '1900년 칙령 제41호로 독도의 영토 관할권을 세계에 공식 선포한 국가' 
      },
      { 
        id: 'daehanminguk', 
        name: '대한민국', 
        level: '중급', 
        lines: 4, 
        chars: ['대', '한', '민', '국'], 
        desc: '영토 주권과 국가적 자부심을 가슴 깊이 품은 자랑스러운 우리 나라' 
      },
      { 
        id: 'dokdogangchi', 
        name: '독도강치', 
        level: '중급', 
        lines: 4, 
        chars: ['독', '도', '강', '치'], 
        desc: '일제강점기 남획으로 사라진 독도 바다의 슬픈 역사를 가진 생명체' 
      },
      { 
        id: 'badasaja', 
        name: '바다사자', 
        level: '중급', 
        lines: 4, 
        chars: ['바', '다', '사', '자'], 
        desc: '독도 연안을 평화롭게 누비던 독도 강치의 다른 이름' 
      },

      // 상급 코스 (5행시 이상)
      { 
        id: 'cheonyeongimyeol', 
        name: '천연기념물', 
        level: '상급', 
        lines: 5, 
        chars: ['천', '연', '기', '념', '물'], 
        desc: '독도 전체가 지정되어 보호받고 있는 국가 지정 문화재 (천연기념물 제336호)' 
      },
      { 
        id: 'dokdogyeongbidae', 
        name: '독도경비대', 
        level: '상급', 
        lines: 5, 
        chars: ['독', '도', '경', '비', '대'], 
        desc: '365일 24시간 독도를 든든하게 지켜주는 자긍심 높은 수호자들' 
      },
      { 
        id: 'chingryeongjesail', 
        name: '칙령제사일', 
        level: '상급', 
        lines: 5, 
        chars: ['칙', '령', '제', '사', '일'], 
        desc: '1900년 10월 25일 고종 황제가 독도를 울도군 관할로 공식 선포한 날 (독도의 날 계기)' 
      }
    ];

    const playTone = (type) => {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'click') {
          osc.frequency.setValueAtTime(440, ctx.currentTime);
          gain.gain.setValueAtTime(0.08, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
          osc.start();
          osc.stop(ctx.currentTime + 0.1);
        } else if (type === 'submit') {
          osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
          osc.frequency.exponentialRampToValueAtTime(659.25, ctx.currentTime + 0.15); // E5
          osc.frequency.exponentialRampToValueAtTime(783.99, ctx.currentTime + 0.3); // G5
          gain.gain.setValueAtTime(0.12, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
          osc.start();
          osc.stop(ctx.currentTime + 0.4);
        }
      } catch(e) {
        // Audio API disabled or blocked
      }
    };

    function DokdoApp() {
      // Navigation states
      const [viewMode, setViewMode] = useState('student'); // 'student' or 'admin'
      const [studentStep, setStudentStep] = useState(1); // 1: Select Keyword, 2: Write Poem, 3: Student Info, 4: Complete
      
      // Form States
      const [selectedKeyword, setSelectedKeyword] = useState(KEYWORDS_DATA[0]);
      const [poemLines, setPoemLines] = useState({});
      const [studentGrade, setStudentGrade] = useState('1');
      const [studentClass, setStudentClass] = useState('1');
      const [studentNumber, setStudentNumber] = useState('1');
      const [studentName, setStudentName] = useState('');

      // Submissions data store
      const [submissions, setSubmissions] = useState([]);
      const [loadingData, setLoadingData] = useState(true);

      // Admin & Filter States
      const [adminFilterLevel, setAdminFilterLevel] = useState('전체');
      const [adminFilterWord, setAdminFilterWord] = useState('전체');
      const [adminSearch, setAdminSearch] = useState('');
      const [cardNewsTheme, setCardNewsTheme] = useState('ocean'); // 'ocean', 'sunset', 'traditional', 'emerald'
      const [adminViewTab, setAdminViewTab] = useState('list'); // 'list', 'cardnews', or 'sheets'
      const [adminPinModal, setAdminPinModal] = useState(false);
      const [adminPinInput, setAdminPinInput] = useState('');
      const [isAdminAuthenticated, setIsAdminAuthenticated] = useState(false);

      // Google Sheets Webhook URL state with LocalStorage persistence
      const [sheetsWebhookUrl, setSheetsWebhookUrl] = useState(() => {
        return localStorage.getItem('ocean_dokdo_sheets_url') || '';
      });

      const saveSheetsUrl = (url) => {
        setSheetsWebhookUrl(url);
        localStorage.setItem('ocean_dokdo_sheets_url', url);
        showToast('💾 Google Sheets 웹앱 URL이 저장되었습니다.');
      };

      // Modal & Toast Notification State
      const [toastMessage, setToastMessage] = useState(null);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3500);
      };

      useEffect(() => {
        let unsubscribe = null;

        const setupListener = () => {
          const fb = window.oceanFirebase;
          const db = fb ? fb.getDb() : null;

          if (db) {
            const collectionPath = fb.getCollectionPath();
            try {
              const { collection } = window.firebaseFirestoreModule || {};
              // Fallback to simple snapshot listener
              const pathParts = collectionPath.split('/');
              // Using standard module imports from dynamic window references
              import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js").then((fs) => {
                const colRef = fs.collection(db, pathParts[0], pathParts[1], pathParts[2], pathParts[3], pathParts[4], pathParts[5]);
                
                unsubscribe = fs.onSnapshot(colRef, 
                  (snapshot) => {
                    const fetched = [];
                    snapshot.forEach(doc => {
                      fetched.push({ id: doc.id, ...doc.data() });
                    });
                    // Sort locally by timestamp descending
                    fetched.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
                    setSubmissions(fetched);
                    setLoadingData(false);
                  },
                  (error) => {
                    console.warn("Firestore error, loading sample fallback:", error);
                    loadSampleData();
                  }
                );
              }).catch(() => loadSampleData());
            } catch (err) {
              loadSampleData();
            }
          } else {
            // Load sample seed data if Firestore is offline
            loadSampleData();
          }
        };

        const loadSampleData = () => {
          const sampleData = [
            {
              id: 'sample-1',
              keyword: '독도리',
              level: '초급',
              lines: { 
                '독': '독도는 우리 땅, 경상북도 울릉군 울릉읍', 
                '도': '도도한 푸른 동해 물결 위에 우뚝 선', 
                '리': '리(이) 땅 대한민국의 명백한 자랑스러운 영토입니다!' 
              },
              grade: '1', classNum: '3', number: '12', name: '김독도',
              isStarred: true,
              createdAt: { seconds: Date.now() / 1000 - 3600 }
            },
            {
              id: 'sample-2',
              keyword: '이사부',
              level: '초급',
              lines: { '이': '이 땅 독도를 가슴 깊이 새기며', '사': '사람들의 마음속에 영원히 살려낸', '부': '부리부리한 기개의 신라 장군 이사부!' },
              grade: '2', classNum: '1', number: '05', name: '이수호',
              isStarred: true,
              createdAt: { seconds: Date.now() / 1000 - 7200 }
            },
            {
              id: 'sample-3',
              keyword: '천연기념물',
              level: '상급',
              lines: {
                '천': '천혜의 자연 경관이 숨 쉬는 이곳,',
                '연': '연두빛 희귀 생물들이 어우러지고',
                '기': '기묘한 바위들이 가득한 푸른 영토.',
                '념': '념원하던 평화가 깃든 유산이니,',
                '물': '물려주리라 후손에게 영원히 빛나도록!'
              },
              grade: '3', classNum: '5', number: '24', name: '박해양',
              isStarred: true,
              createdAt: { seconds: Date.now() / 1000 - 10800 }
            }
          ];
          setSubmissions(sampleData);
          setLoadingData(false);
        };

        window.addEventListener('firebaseAuthReady', setupListener);
        setupListener();

        return () => {
          if (unsubscribe) unsubscribe();
          window.removeEventListener('firebaseAuthReady', setupListener);
        };
      }, []);

      // Initialize poem input lines when keyword changes
      useEffect(() => {
        if (selectedKeyword) {
          const initialLines = {};
          selectedKeyword.chars.forEach(char => {
            initialLines[char] = poemLines[char] || '';
          });
          setPoemLines(initialLines);
        }
      }, [selectedKeyword]);

      const handleKeywordSelect = (kw) => {
        playTone('click');
        setSelectedKeyword(kw);
        setPoemLines({});
        setStudentStep(2);
      };

      const handlePoemInputChange = (char, val) => {
        setPoemLines(prev => ({ ...prev, [char]: val }));
      };

      const isPoemComplete = useMemo(() => {
        if (!selectedKeyword) return false;
        return selectedKeyword.chars.every(char => poemLines[char] && poemLines[char].trim().length > 0);
      }, [selectedKeyword, poemLines]);

      const handleSubmitPoem = async () => {
        if (!studentName.trim()) {
          showToast('⚠️ 작성자의 이름을 입력해 주세요!');
          return;
        }

        playTone('submit');

        const newPoemData = {
          keyword: selectedKeyword.name,
          level: selectedKeyword.level,
          lines: poemLines,
          grade: studentGrade,
          classNum: studentClass,
          number: studentNumber,
          name: studentName.trim(),
          isStarred: false,
          createdAt: new Date()
        };

        // 1. Sync to Google Sheets via Webhook if configured
        if (sheetsWebhookUrl && sheetsWebhookUrl.trim()) {
          const formattedPoemText = Object.entries(poemLines)
            .map(([char, line]) => `[${char}] ${line}`)
            .join('\n');

          const sheetsPayload = {
            timestamp: new Date().toLocaleString('ko-KR', { timeZone: 'Asia/Seoul' }),
            grade: studentGrade,
            classNum: studentClass,
            number: studentNumber,
            name: studentName.trim(),
            keyword: selectedKeyword.name,
            level: selectedKeyword.level,
            poemText: formattedPoemText
          };

          fetch(sheetsWebhookUrl, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(sheetsPayload)
          }).catch(err => console.warn('Google Sheets transmission note:', err));
        }

        // 2. Save to Firestore DB
        const fb = window.oceanFirebase;
        const db = fb ? fb.getDb() : null;

        if (db) {
          try {
            const fs = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");
            const collectionPath = fb.getCollectionPath();
            const pathParts = collectionPath.split('/');
            const colRef = fs.collection(db, pathParts[0], pathParts[1], pathParts[2], pathParts[3], pathParts[4], pathParts[5]);
            await fs.addDoc(colRef, {
              ...newPoemData,
              createdAt: fs.serverTimestamp()
            });
          } catch (e) {
            console.error("Firestore save error, saving locally:", e);
            setSubmissions(prev => [{ id: 'local-' + Date.now(), ...newPoemData, createdAt: { seconds: Date.now() / 1000 } }, ...prev]);
          }
        } else {
          setSubmissions(prev => [{ id: 'local-' + Date.now(), ...newPoemData, createdAt: { seconds: Date.now() / 1000 } }, ...prev]);
        }

        setStudentStep(4);
        showToast('🎉 N행시가 성공적으로 제출되었습니다!');
      };

      const resetStudentForm = () => {
        playTone('click');
        setStudentStep(1);
        setPoemLines({});
        setStudentName('');
      };

      // Admin authentication toggle
      const handleAdminAccess = () => {
        playTone('click');
        if (isAdminAuthenticated) {
          setViewMode('admin');
        } else {
          setAdminPinModal(true);
        }
      };

      const verifyAdminPin = () => {
        // Simple default school PIN verification (2026 or 1025)
        if (adminPinInput === '2026' || adminPinInput === '1025' || adminPinInput === 'ocean') {
          setIsAdminAuthenticated(true);
          setAdminPinModal(false);
          setViewMode('admin');
          setAdminPinInput('');
          showToast('🔓 관리자 인증되었습니다.');
        } else {
          showToast('❌ 비밀번호가 올바르지 않습니다. (기본: 2026 또는 1025)');
        }
      };

      // Toggle starred status for card news feature
      const toggleStar = async (submissionId) => {
        playTone('click');
        const target = submissions.find(s => s.id === submissionId);
        if (!target) return;
        const newStar = !target.isStarred;

        // Update local state immediately
        setSubmissions(prev => prev.map(item => item.id === submissionId ? { ...item, isStarred: newStar } : item));

        const fb = window.oceanFirebase;
        const db = fb ? fb.getDb() : null;
        if (db && !submissionId.startsWith('sample-') && !submissionId.startsWith('local-')) {
          try {
            const fs = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");
            const collectionPath = fb.getCollectionPath();
            const pathParts = collectionPath.split('/');
            const docRef = fs.doc(db, pathParts[0], pathParts[1], pathParts[2], pathParts[3], pathParts[4], pathParts[5], submissionId);
            await fs.updateDoc(docRef, { isStarred: newStar });
          } catch(e) {
            console.error(e);
          }
        }
      };

      // Filtered submissions for admin view
      const filteredSubmissions = useMemo(() => {
        return submissions.filter(item => {
          const matchLevel = adminFilterLevel === '전체' || item.level === adminFilterLevel;
          const matchWord = adminFilterWord === '전체' || item.keyword === adminFilterWord;
          const searchLower = adminSearch.toLowerCase();
          const matchSearch = !adminSearch || 
            item.name.toLowerCase().includes(searchLower) ||
            item.keyword.toLowerCase().includes(searchLower) ||
            `${item.grade}학년 ${item.classNum}반`.includes(searchLower);
          return matchLevel && matchWord && matchSearch;
        });
      }, [submissions, adminFilterLevel, adminFilterWord, adminSearch]);

      return (
        <div className="min-h-screen pb-16 flex flex-col">
          {/* Top Header Banner */}

                          : 'bg-slate-900/60 text-emerald-400 hover:text-emerald-300 border border-emerald-500/30'
                      }`}
                    >
                      📊 구글 시트 연동 설정
                    </button>
                    <button
                      onClick={() => window.print()}
                      className="px-3.5 py-2 bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-bold rounded-xl transition-all shadow"
                    >
                      🖨️ 카드뉴스 인쇄 / PDF
                    </button>
                  </div>
                </div>

                {/* Filters & Search Control Bar */}
                {adminViewTab !== 'sheets' && (
                  <div className="glass-panel p-4 rounded-xl grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3 no-print">
                    <div>
                      <label className="block text-xs text-slate-400 mb-1">코스 난이도 필터</label>
                      <select
                        value={adminFilterLevel}
                        onChange={(e) => setAdminFilterLevel(e.target.value)}
                        className="w-full bg-slate-900 border border-slate-700 text-xs text-white rounded-lg px-3 py-2 outline-none"
                      >
                        <option value="전체">전체 난이도</option>
                        <option value="초급">초급 (3행시)</option>
                        <option value="중급">중급 (4행시)</option>
                        <option value="상급">상급 (5행시)</option>
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs text-slate-400 mb-1">제시어 필터</label>
                      <select
                        value={adminFilterWord}
                        onChange={(e) => setAdminFilterWord(e.target.value)}
                        className="w-full bg-slate-900 border border-slate-700 text-xs text-white rounded-lg px-3 py-2 outline-none"
                      >
                        <option value="전체">전체 제시어</option>
                        {KEYWORDS_DATA.map(k => (
                          <option key={k.id} value={k.name}>{k.name}</option>
                        ))}
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs text-slate-400 mb-1">이름 / 제시어 검색</label>
                      <input
                        type="text"
                        placeholder="검색어 입력..."
                        value={adminSearch}
                        onChange={(e) => setAdminSearch(e.target.value)}
                        className="w-full bg-slate-900 border border-slate-700 text-xs text-white rounded-lg px-3 py-2 outline-none"
                      />
                    </div>

                    {adminViewTab === 'cardnews' && (
                      <div>
                        <label className="block text-xs text-slate-400 mb-1">카드뉴스 테마</label>
                        <select
                          value={cardNewsTheme}
                          onChange={(e) => setCardNewsTheme(e.target.value)}
                          className="w-full bg-slate-900 border border-slate-700 text-xs text-white rounded-lg px-3 py-2 outline-none"
                        >
                          <option value="ocean">🌊 푸른 동해 (기본)</option>
                          <option value="sunset">🌅 독도 일출 (골드)</option>
                          <option value="traditional">📜 고지도 한지 (전통)</option>
                          <option value="emerald">🌿 청정 독도 (에메랄드)</option>
                        </select>
                      </div>
                    )}
                  </div>
                )}

                {/* TAB 1: Admin Data Table View */}
                {adminViewTab === 'list' && (
                  <div className="glass-panel rounded-2xl overflow-hidden border border-slate-800">
                    <div className="overflow-x-auto">
                      <table className="w-full text-left text-xs">
                        <thead className="bg-slate-900/90 text-slate-400 border-b border-slate-800 uppercase tracking-wider">
                          <tr>
                            <th className="p-3 text-center">우수작</th>
                            <th className="p-3">학번 / 이름</th>
                            <th className="p-3">제시어 (난이도)</th>
                            <th className="p-3">N행시 내용</th>
                            <th className="p-3">제출 시각</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-800/60 text-slate-300">
                          {filteredSubmissions.length === 0 ? (
                            <tr>
                              <td colSpan="5" className="p-8 text-center text-slate-500">
                                조건에 맞는 N행시 제출 내역이 없습니다.
                              </td>
                            </tr>
                          ) : (
                            filteredSubmissions.map((sub) => (
                              <tr key={sub.id} className="hover:bg-slate-800/40 transition-colors">
                                <td className="p-3 text-center">
                                  <button
                                    onClick={() => toggleStar(sub.id)}
                                    className={`text-base transition-transform active:scale-125 ${
                                      sub.isStarred ? 'text-amber-400' : 'text-slate-600 hover:text-amber-300'
                                    }`}
                                    title="우수작 선정 (카드뉴스 강조)"
                                  >
                                    {sub.isStarred ? '★' : '☆'}
                                  </button>
                                </td>
                                <td className="p-3 font-semibold whitespace-nowrap text-white">
                                  {sub.grade}학년 {sub.classNum}반 {sub.number}번<br/>
                                  <span className="text-cyan-400">{sub.name}</span>
                                </td>
                                <td className="p-3 whitespace-nowrap">
                                  <span className="font-bold text-white">[{sub.keyword}]</span>
                                  <span className="ml-1 text-[10px] px-1.5 py-0.5 rounded bg-slate-800 text-slate-400">
                                    {sub.level}
                                  </span>
                                </td>
                                <td className="p-3 font-batang space-y-1">
                                  {Object.entries(sub.lines || {}).map(([char, line]) => (
                                    <div key={char} className="leading-snug">
                                      <span className="font-bold text-cyan-400 mr-1.5">[{char}]</span>
                                      <span>{line}</span>
                                    </div>
                                  ))}
                                </td>
                                <td className="p-3 text-slate-500 whitespace-nowrap text-[11px]">
                                  {sub.createdAt?.seconds 
                                    ? new Date(sub.createdAt.seconds * 1000).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })
                                    : '방금 전'}
                                </td>
                              </tr>
                            ))
                          )}
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}

                {/* TAB 2: Card News Output Printable View */}
                {/* TAB 3: Google Sheets Integration Setup */}
                {adminViewTab === 'sheets' && (
                  <div className="glass-panel p-6 rounded-2xl space-y-6 border border-emerald-500/30">
                    <div className="flex items-center justify-between border-b border-slate-700/80 pb-4">
                      <div>
                        <span className="px-2.5 py-0.5 bg-emerald-500/20 text-emerald-300 text-xs font-bold rounded border border-emerald-500/40">
                          실시간 수집 설정
                        </span>
                        <h3 className="text-xl font-bold text-white mt-1">
                          📊 구글 스프레드시트 수집 연동
                        </h3>
                      </div>
                      <a
                        href="https://docs.google.com/spreadsheets/d/1oeNYFMiNSQ1Rv0BzjLnAc55aWUaGzFUEn7Sb0G6cKSI/edit?gid=0#gid=0"
                        target="_blank"
                        rel="noopener noreferrer"
                        className="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold rounded-xl flex items-center gap-2 shadow"
                      >
                        <span>🔗 지정된 Google Sheet 바로가기</span>
                        <span>↗</span>
                      </a>
                    </div>

                    {/* Webhook Input Field */}
                    <div className="bg-slate-900/90 p-5 rounded-xl border border-slate-700 space-y-3">

                      </label>
                      <div className="flex gap-2">
                        <input
                          type="url"
                          placeholder="https://script.google.com/macros/s/.../exec"
                          value={sheetsWebhookUrl}
                          onChange={(e) => setSheetsWebhookUrl(e.target.value)}
                          className="flex-1 bg-slate-950 border border-slate-700 text-xs text-white rounded-xl px-4 py-2.5 outline-none focus:border-emerald-400"
                        />
                        <button
                          onClick={() => saveSheetsUrl(sheetsWebhookUrl)}
                          className="px-5 py-2.5 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-xs rounded-xl shadow transition-all shrink-0"
                        >
                          저장하기
                        </button>
                      </div>
                      <p className="text-xs text-slate-400">
                        {sheetsWebhookUrl ? (
                          <span className="text-emerald-400 font-semibold">✅ 현재 웹앱 URL이 저장되어 있으며, 학생 제출 시 구글 시트로 자동 전송됩니다.</span>
                        ) : (
                          <span className="text-amber-400">⚠️ 저장된 URL이 없습니다. 아래 3단계 가이드에 따라 배포 후 URL을 입력해 주세요.</span>
                        )}
                      </p>
                    </div>

                    {/* Step-by-Step Google Apps Script Integration Guide */}
                    <div className="space-y-4">
                      <h4 className="text-sm font-bold text-cyan-300">
                        🛠️ 지정 구글 시트 연동 3단계 가이드 (최초 1회만 설정)
                      </h4>

                      <div className="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs">
                        <div className="bg-slate-900/80 p-4 rounded-xl border border-slate-800 space-y-2">
                          <div className="font-bold text-emerald-400">1단계: Apps Script 열기</div>
                          <p className="text-slate-300 leading-relaxed">
                            구글 시트 상단 메뉴에서 <strong className="text-white">확장 프로그램 &gt; Apps Script</strong>를 클릭합니다.
                          </p>
                        </div>

                        <div className="bg-slate-900/80 p-4 rounded-xl border border-slate-800 space-y-2">
                          <div className="font-bold text-emerald-400">2단계: 아래 스크립트 붙여넣기</div>
                          <p className="text-slate-300 leading-relaxed">
                            기존 에디터 내용을 삭제하고 아래 상자의 코드 전체를 복사하여 붙여넣고 저장(Ctrl+S)합니다.
                          </p>
                        </div>

                        <div className="bg-slate-900/80 p-4 rounded-xl border border-slate-800 space-y-2">
                          <div className="font-bold text-emerald-400">3단계: 웹앱으로 배포하기</div>
                          <p className="text-slate-300 leading-relaxed">
                            우측 상단 <strong className="text-white">배포 &gt; 새 배포</strong> 선택 &rarr; 유형: <strong className="text-white">웹 앱</strong> &rarr; 액세스 권한: <strong className="text-emerald-300 font-bold">모든 사용자(Anyone)</strong> 선택 후 배포하여 URL을 복사해 위 상자에 입력하세요.
                          </p>
                        </div>
                      </div>

                      {/* Code Block for Apps Script */}
                      <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 relative group">
                        <div className="flex items-center justify-between pb-2 border-b border-slate-800 mb-3 text-xs text-slate-400">
                          <span>Google Apps Script (`Code.gs`)</span>
                          <button
                            onClick={() => {
                              const codeText = `function doPost(e) {
  try {
    var sheet = SpreadsheetApp.getActiveSpreadsheet().getActiveSheet();
    var data = JSON.parse(e.postData.contents);
    
    // 헤더 행이 없을 경우 자동 생성
    if (sheet.getLastRow() === 0) {
      sheet.appendRow(["제출일시", "학년", "반", "번호", "이름", "제시어", "난이도", "N행시 내용"]);
    }
    
    sheet.appendRow([
      data.timestamp || new Date().toLocaleString("ko-KR"),
      data.grade + "학년",
      data.classNum + "반",
      data.number + "번",
      data.name,
      data.keyword,
      data.level,
      data.poemText
    ]);
    
    return ContentService.createTextOutput(JSON.stringify({ result: "success" }))
      .setMimeType(ContentService.MimeType.JSON);
  } catch (error) {
    return ContentService.createTextOutput(JSON.stringify({ result: "error", message: error.toString() }))
      .setMimeType(ContentService.MimeType.JSON);
  }
}`;
                              const textArea = document.createElement("textarea");
                              textArea.value = codeText;
                              document.body.appendChild(textArea);
                              textArea.select();
                              document.execCommand("copy");
                              document.body.removeChild(textArea);
                              showToast('📋 구글 스크립트 코드가 복사되었습니다!');
                            }}
                            className="px-3 py-1 bg-cyan-600 hover:bg-cyan-500 text-white font-bold rounded-lg transition-all"
                          >
                            📋 코드 복사하기
                          </button>
                        </div>
                        <pre className="text-[11px] font-mono text-emerald-300 leading-relaxed overflow-x-auto p-2">
{`function doPost(e) {
  try {
    var sheet = SpreadsheetApp.getActiveSpreadsheet().getActiveSheet();
    var data = JSON.parse(e.postData.contents);
    
    // 헤더 행이 없을 경우 자동 생성
    if (sheet.getLastRow() === 0) {
      sheet.appendRow(["제출일시", "학년", "반", "번호", "이름", "제시어", "난이도", "N행시 내용"]);
    }
    
    sheet.appendRow([
      data.timestamp || new Date().toLocaleString("ko-KR"),
      data.grade + "학년",
      data.classNum + "반",
      data.number + "번",
      data.name,
      data.keyword,
      data.level,
      data.poemText
    ]);
    
    return ContentService.createTextOutput(JSON.stringify({ result: "success" }))
      .setMimeType(ContentService.MimeType.JSON);
  } catch (error) {
    return ContentService.createTextOutput(JSON.stringify({ result: "error", message: error.toString() }))
      .setMimeType(ContentService.MimeType.JSON);
  }
}`}
                        </pre>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            )}
          </main>

          {/* Admin PIN Authentication Modal */}
          {adminPinModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="glass-panel p-6 rounded-2xl max-w-sm w-full space-y-4 border border-cyan-500/40 shadow-2xl">
                <div className="text-center space-y-1">
                  <div className="text-3xl">🔒</div>
                  <h3 className="text-lg font-bold text-white">관리자 인증</h3>
                  <p className="text-xs text-slate-400">교사 및 담당자 전용 기능입니다.</p>
                </div>

                <div>
                  <input
                    type="password"
                    placeholder="인증 비밀번호 입력 (기본: 2026)"
                    value={adminPinInput}
                    onChange={(e) => setAdminPinInput(e.target.value)}
                    onKeyDown={(e) => e.key === 'Enter' && verifyAdminPin()}
                    className="w-full bg-slate-900 border border-slate-700 text-center text-white text-sm rounded-xl py-2.5 outline-none focus:border-cyan-400"
                    autoFocus
                  />
                </div>

                <div className="flex gap-2">
                  <button
                    onClick={() => setAdminPinModal(false)}
                    className="flex-1 py-2 bg-slate-800 text-slate-300 text-xs font-bold rounded-xl"
                  >
                    취소
                  </button>
                  <button
                    onClick={verifyAdminPin}
                    className="flex-1 py-2 bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-bold rounded-xl"
                  >
                    확인
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Toast Notification Popup */}
          {toastMessage && (
            <div className="fixed bottom-6 right-6 z-50 bg-cyan-500 text-slate-950 px-5 py-3 rounded-2xl font-bold text-xs shadow-2xl animate-bounce">
              {toastMessage}
            </div>
          )}

          {/* Footer */}
          <footer className="no-print border-t border-slate-800 py-4 text-center text-xs text-slate-500 mt-auto">
            오션중학교 2026 독도의 날 기념 독도교육주간 • 대한민국 독도 영토 주권 수호 행사
          </footer>
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<DokdoApp />);
  </script>
</body>
</html>
